.ic{flex:none;vertical-align:-3px}

#bn a{position:relative;flex:1;height:100%;display:grid;place-items:center;color:#ffffffa6}
#bn a.on{color:#fff}
#bn a.on::after{content:'';position:absolute;bottom:8px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
#bn a.fab::after{display:none}
#bn a.fab span{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--gd);display:grid;place-items:center;margin-top:-30px;border:5px solid var(--bg);box-shadow:0 8px 18px #fbbf2466}
#bn .cdot{position:absolute;top:17px;left:calc(50% + 6px);width:12px;height:12px;border:2px solid var(--nv)}
body.inchat #bn{display:none}body.inchat main{padding-bottom:12px}
.hm{display:none}
@media(min-width:600px){.hm{display:inline-flex}}
@media(max-width:599px){.logo span{display:none}.hc{max-width:60%}.hero h1{font-size:24px}.hero p{font-size:13px}.hero .btn{padding:10px 6px;font-size:13px}#modal .mb{align-items:flex-end;padding:0}.mc{max-width:none;border-radius:26px 26px 0 0}.dt{grid-template-columns:1fr}}
@media(min-width:900px){
  .dn{display:flex}#bn{display:none}
  .nav{height:70px}.sb{margin:0 12px}
  main{padding-bottom:36px}footer{padding-bottom:26px}#toast{bottom:28px}
  .hero{min-height:400px;padding:48px 44px 76px;margin-top:22px}



  .cats{display:grid;grid-template-columns:repeat(9,1fr);overflow:visible}.ct{width:auto}
  .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .fb{grid-template-columns:1fr 1.3fr 1fr 1fr 1fr}
  .chat{height:calc(100dvh - 70px - 36px)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

async function doAuth(t){

  }catch(x){if(++tries>=5){lock=Date.now()+6e4;tries=0}
    toast({'auth/invalid-credential':'Email atau kata sandi salah','auth/email-already-in-use':'Email sudah terdaftar','auth/weak-password':'Kata sandi terlalu lemah','auth/invalid-email':'Format email salah'}[x.code]||'Gagal: '+x.code)}

    else{const r=await addDoc(collection(db,'listings'),{...d,sellerId:uid,sellerName:prof?.name||'Pengguna',sellerAvatar:prof?.avatar||'',views:0,likes:0,commentsCount:0,createdAt:serverTimestamp(),expiresAt:Timestamp.fromMillis(Date.now()+CFG.expireDays*864e5)});id=r.id}
    last=0;toast('Iklan tersimpan');location.hash='#/iklan/'+id})
}

/* ===== AKUN, FAVORIT, PROFIL PENJUAL ===== */
async function account(){
  if(!me){A.innerHTML=empty('Masuk untuk membuka akun','','<button class="btn" onclick="authUI()">Masuk</button>');return}
  A.innerHTML=`<div class="narrow" style="margin:auto">${skel(1)}</div>`;
  const s=await getDocs(query(collection(db,'listings'),where('sellerId','==',uid))),ls=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));
  A.innerHTML=`<div class="narrow" style="margin:auto"><h2>Akun saya</h2><form class="fm box" onsubmit="saveP(event)">
  <div class="row" style="justify-content:center;flex-direction:column;gap:8px"><label style="position:relative;cursor:pointer;display:block;width:96px;height:96px;flex:none"><img class="av" id="pa" style="width:96px;height:96px;border-width:3px;border-color:var(--ln)" src="${esc(prof?.avatar||'icon.png')}" alt="Foto profil"><span style="position:absolute;right:0;bottom:0;width:32px;height:32px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;border:3px solid #fff">${ic('plus',16)}</span><input type="file" accept="image/*" hidden onchange="avPick(this.files[0])"></label><div class="mt">Ketuk foto untuk pilih dari galeri</div><button type="button" class="btn o s" onclick="avDel()">Hapus foto</button></div>
  <label>Nama<input name="name" required maxlength="40" value="${esc(prof?.name)}"></label><label>Deskripsi singkat<input name="bio" maxlength="160" value="${esc(prof?.bio)}"></label><label>Kota / kabupaten<input name="city" maxlength="60" value="${esc(prof?.city)}"></label>
  <label style="display:flex;flex-direction:row;gap:8px;align-items:center;font-weight:600"><input type="checkbox" name="hide" style="width:auto" ${prof?.hideCity?'checked':''}>Sembunyikan kota di profil publik</label>
  <div class="row"><button class="btn">Simpan profil</button><button type="button" class="btn o" onclick="logout()">Keluar</button></div><button type="button" class="btn o s" style="color:#e11d48;justify-self:center" onclick="delAcc()">Hapus akun saya</button></form>
  <h3>Iklan saya (${ls.length})</h3>${ls.map(l=>`<div class="lr"><img src="${esc(l.images?.[0]||'icon.png')}" alt=""><div><a href="#/iklan/${l.id}"><b>${esc(l.title)}</b></a><div class="mt">${rp(l.price)} · ${{active:'Aktif',sold:'Terjual',hidden:'Disembunyikan'}[l.status]} · ${ic('eye',13)} ${l.views||0}</div>
  <div class="row" style="margin-top:6px"><a class="btn o s" href="#/jual/${l.id}">Edit</a>${l.status==='sold'?`<button class="btn o s" onclick="setSt('${l.id}','active')">Aktifkan</button>`:`<button class="btn o s" onclick="setSt('${l.id}','sold')">Tandai terjual</button>`}${l.status==='hidden'?'':`<button class="btn o s" onclick="setSt('${l.id}','hidden')">Sembunyikan</button>`}<button class="btn o s" onclick="ext('${l.id}')">Perpanjang</button><button class="btn r s" onclick="delL('${l.id}')">Hapus</button></div></div></div>`).join('')||empty('Belum ada iklan','','<a class="btn" href="#/jual">Pasang iklan pertama</a>')}</div>`;
}
let newAv=null;const avPick=async f=>{if(!f)return;try{newAv=await comp(f,300,.8);$('#pa').src=newAv}catch(e){toast(e.message)}};
const avDel=()=>{newAv='';$('#pa').src='icon.png';toast('Foto dihapus, tekan Simpan profil')};
async function saveP(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  const d={name:f.name.trim(),bio:f.bio.trim(),city:f.city.trim(),hideCity:!!f.hide,avatar:newAv!==null?newAv:(prof?.avatar||'')};
  await guard(async()=>{await setDoc(doc(db,'users',uid),d,{merge:true});await updateProfile(me,{displayName:d.name});prof={...prof,...d};newAv=null;nav();toast('Profil disimpan')})}
const delAcc=()=>confirm('Hapus akun PERMANEN beserta semua iklan, favorit, dan profil Anda? Tidak bisa dibatalkan.')&&guard(async()=>{
  for(const d of (await getDocs(query(collection(db,'listings'),where('sellerId','==',uid)))).docs)await deleteDoc(d.ref||doc(db,'listings',d.id));
  for(const d of (await getDocs(query(collection(db,'favorites'),where('uid','==',uid)))).docs)await deleteDoc(d.ref||doc(db,'favorites',d.id));
  await deleteDoc(doc(db,'users',uid));
  try{await (M.deleteUser||(async()=>{}))(me)}catch(e){if(e.code==='auth/requires-recent-login'){toast('Data dihapus. Keluar, masuk lagi, lalu tekan Hapus akun sekali lagi untuk menghapus login.');return}throw e}
  last=0;toast('Akun dihapus');location.hash='#/'});
const setSt=(id,st)=>guard(async()=>{await updateDoc(doc(db,'listings',id),{status:st});last=0;toast('Status diperbarui');account()});
const ext=id=>guard(async()=>{await updateDoc(doc(db,'listings',id),{expiresAt:Timestamp.fromMillis(Date.now()+CFG.expireDays*864e5),status:'active'});last=0;toast('Iklan diperpanjang '+CFG.expireDays+' hari');account()});
const delL=id=>confirm('Hapus iklan ini permanen?')&&guard(async()=>{await deleteDoc(doc(db,'listings',id));last=0;toast('Iklan dihapus');account()});

async function favPage(){
  if(!me){A.innerHTML=empty('Masuk untuk melihat favorit','','<button class="btn" onclick="authUI()">Masuk</button>');return}
  A.innerHTML=`<h2>Barang favorit</h2><div class="grid">${skel(4)}</div>`;
  const s=await Promise.all([...favs].slice(0,30).map(i=>getDoc(doc(db,'listings',i)))),a=s.filter(x=>x.exists()).map(x=>({id:x.id,...x.data()}));
  A.innerHTML=`<h2>Barang favorit</h2><div class="grid">${a.map(card).join('')||empty('Belum ada favorit','Ketuk ikon hati pada iklan untuk menyimpannya.','<a class="btn" href="#/">Jelajahi barang</a>')}</div>`;
}
async function seller(id){
  A.innerHTML=`<div class="grid">${skel(4)}</div>`;
  const [u,s]=await Promise.all([getDoc(doc(db,'users',id)),getDocs(query(collection(db,'listings'),where('sellerId','==',id)))]);
  if(!u.exists())return A.innerHTML=empty('Penjual tidak ditemukan');
  const p=u.data(),ls=s.docs.map(d=>({id:d.id,...d.data()})),act=ls.filter(live),sold=ls.filter(l=>l.status==='sold').length,wa=act.map(waLink).find(Boolean);
  document.title=p.name+' — Lapak.id';
  A.innerHTML=`<div class="box" style="text-align:center;margin-top:16px"><img class="av" style="width:80px;height:80px" src="${esc(p.avatar||'icon.png')}" alt=""><h2 style="margin:6px 0 0">${esc(p.name)} ${p.verified?`<span style="color:var(--g);vertical-align:-3px" title="Terverifikasi">${ic('check',22)}</span>`:''}</h2><p class="mt">${esc(p.bio||'')}</p>
  <p class="mt">${p.hideCity?'':ic('pin',14)+' '+esc(p.city||'-')+' · '}Bergabung ${p.joined?new Date(ms(p.joined)).toLocaleDateString('id-ID',{month:'long',year:'numeric'}):'-'}<br>${act.length} iklan aktif · ${sold} barang terjual</p>
  <div class="row" style="justify-content:center">${wa&&id!==uid?`<a class="btn o" target="_blank" rel="noopener" href="${wa}">WhatsApp</a>`:''}${id!==uid?`<button class="btn o" onclick="report('user','${id}','')">${ic('flag',15)} Laporkan pengguna</button>`:''}</div></div>
  <h3>Iklan aktif</h3><div class="grid">${act.map(card).join('')||empty('Belum ada iklan aktif')}</div>`;
}

/* ===== CHAT (REALTIME) ===== */
async function startChat(lid){
  if(!need())return;const l=(await getDoc(doc(db,'listings',lid))).data();if(l.sellerId===uid)return toast('Ini iklan Anda');
  const cid=lid+'_'+uid;await guard(async()=>{const r=doc(db,'conversations',cid);let ex=false;try{ex=(await getDoc(r)).exists()}catch{}
    if(!ex)await setDoc(r,{listingId:lid,title:l.title,members:[l.sellerId,uid],names:{[uid]:prof?.name||'Pengguna',[l.sellerId]:l.sellerName},last:'',lastBy:'',lastAt:Date.now(),seen:{},blocked:[]});
    location.hash='#/chat/'+cid})
}
async function chats(){
  if(!me){A.innerHTML=empty('Masuk untuk membuka chat','','<button class="btn" onclick="authUI()">Masuk</button>');return}
  A.innerHTML=`<div class="narrow" style="margin:auto"><h2>Chat</h2><div id="cl">${skel(1)}</div></div>`;
  const s=await getDocs(query(collection(db,'conversations'),where('members','array-contains',uid))),cs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.lastAt-a.lastAt);
  $('#cl').innerHTML=cs.map(c=>{const o=c.members.find(x=>x!==uid),nw=c.lastBy&&c.lastBy!==uid&&(c.seen?.[uid]||0)<c.lastAt;return`<a class="lr" href="#/chat/${c.id}"><div><b>${esc(c.names?.[o]||'Pengguna')}</b> ${nw?'<span class="tag">baru</span>':''}<div class="mt">${esc(c.title)}</div><div class="mt">${esc(c.last||'Mulai percakapan')}</div></div></a>`}).join('')||empty('Belum ada percakapan','Buka iklan lalu ketuk "Chat penjual".','<a class="btn" href="#/">Cari barang</a>');
}
async function thread(cid){
  if(!me){A.innerHTML=empty('Masuk untuk membuka chat');return}
  A.innerHTML=`<div class="narrow chat" style="margin:auto"><div class="ch"><a href="#/chat">${ic('back',16)} Chat</a> · <b id="cn"></b><div class="mt"><a id="ct" href="#"></a></div><div class="row" style="margin-top:4px"><button class="btn o s" id="cb" onclick="blockC('${cid}')">Blokir</button><button class="btn o s" id="cr">Laporkan</button></div></div><div id="ms"></div><form class="row" style="flex-wrap:nowrap" onsubmit="send(event,'${cid}')"><input id="mi2" maxlength="500" placeholder="Tulis pesan…" autocomplete="off" required><button class="btn" style="flex:none">Kirim</button></form></div>`;
  unsub.push(onSnapshot(doc(db,'conversations',cid),s=>{if(!s.exists())return;cur=s.data();const o=cur.members.find(x=>x!==uid);
    $('#cn').textContent=cur.names?.[o]||'Pengguna';$('#ct').textContent=cur.title;$('#ct').href='#/iklan/'+cur.listingId;$('#cr').onclick=()=>report('user',o,cur.listingId);
    $('#cb').textContent=cur.blocked?.length?'Percakapan diblokir':'Blokir';const f=$('#mi2');if(f)f.disabled=!!cur.blocked?.length}));
  unsub.push(onSnapshot(query(collection(db,'conversations',cid,'messages'),orderBy('at')),s=>{
    const m=s.docs.map(d=>d.data()),box=$('#ms');if(!box)return;const lm=[...m].reverse().find(x=>x.from===uid);
    box.innerHTML=m.map(x=>`<div class="bb ${x.from===uid?'me':''}">${esc(x.text)}<small>${new Date(x.at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}${x===lm&&x.from===uid&&Object.entries(cur.seen||{}).some(([k,t])=>k!==uid&&t>=x.at)?' · dibaca':''}</small></div>`).join('');
    box.scrollTop=box.scrollHeight;const e=m[m.length-1];
    if(e&&e.from!==uid)updateDoc(doc(db,'conversations',cid),{['seen.'+uid]:Date.now()}).catch(()=>{})}));
}
async function send(e,cid){e.preventDefault();const i=$('#mi2'),t=i.value.trim();if(!t)return;
  if(cur.blocked?.length)return toast('Percakapan ini diblokir');if(Date.now()-lastM<800)return toast('Pelan-pelan ya');lastM=Date.now();i.value='';
  await guard(async()=>{const at=Date.now();await addDoc(collection(db,'conversations',cid,'messages'),{from:uid,text:t.slice(0,500),at});await updateDoc(doc(db,'conversations',cid),{last:t.slice(0,60),lastBy:uid,lastAt:at,['seen.'+uid]:at})})}
const blockC=cid=>confirm('Blokir percakapan ini? Kedua pihak tidak bisa mengirim pesan lagi.')&&guard(async()=>{await updateDoc(doc(db,'conversations',cid),{blocked:arrayUnion(uid)});toast('Percakapan diblokir')});

async function R(){
  unsub.forEach(f=>f());unsub=[];modal();scrollTo(0,0);mark();document.body.classList.toggle('inchat',/^#\/chat\/./.test(location.hash));
  const p=location.hash.slice(1).split('/').filter(Boolean),v=p[0];

    if(!v)return home();if(v==='iklan')return detail(p[1]);if(v==='penjual')return seller(p[1]);if(v==='favorit')return favPage();
    if(v==='chat')return p[1]?thread(p[1]):chats();if(v==='akun')return account();if(v==='jual')return sellForm(p[1]);if(v==='info')return info(p[1]);home()});
}

<script id="ui-fx">
(()=>{const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const bar=document.createElement('div');bar.id='sp';document.body.appendChild(bar);
const hd=document.querySelector('header');let tk=0;
addEventListener('scroll',()=>{if(tk)return;tk=requestAnimationFrame(()=>{tk=0;const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;
bar.style.transform='scaleX('+(h>0?Math.min(1,y/h):0)+')';hd&&hd.classList.toggle('sc',y>20);
})},{passive:true});
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('.btn');if(!b||RM)return;
const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,p=document.createElement('span');p.className='rp';
p.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';b.appendChild(p);setTimeout(()=>p.remove(),700)},{passive:true});
if(RM)return;
if((navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=3){document.documentElement.classList.add('lite');return}
const SEL='.cd,.box,.lr,.em,.ct,.cm,.dt>*,h2,h3,.fb>*,.r1';
const io=new IntersectionObserver(es=>{let n=0;es.forEach(e=>{if(e.isIntersecting){const t=e.target;t.style.setProperty('--d',Math.min(n++,8)*.05+'s');t.classList.add('in');io.unobserve(t)}})},{threshold:.08,rootMargin:'0px 0px -6% 0px'});
const seen=new WeakSet();let fresh=true,ft,cuDone=0;const fr=()=>{fresh=true;clearTimeout(ft);ft=setTimeout(()=>fresh=false,2500)};fr();
function scan(root){root.querySelectorAll(SEL).forEach(el=>{if(seen.has(el))return;seen.add(el);if(!fresh)return;el.classList.add('rv');io.observe(el)})}
function countUp(){if(cuDone)return;document.querySelectorAll('.st .box b').forEach(b=>{if(b.dataset.c)return;cuDone=1;const v=parseInt(b.textContent.replace(/\D/g,''),10);b.dataset.c=1;if(isNaN(v)||v<1)return;
const n=b.firstChild;if(!n)return;const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);n.nodeValue=Math.round(v*(1-Math.pow(1-k,3))).toLocaleString('id-ID');k<1&&requestAnimationFrame(f)})(t0)})}
const host=document.querySelector('#app,#root');
if(host){let q=0;new MutationObserver(()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;scan(host);countUp()})}).observe(host,{childList:true,subtree:true});scan(host)}
const pg=()=>{if(!host)return;host.classList.remove('pg');void host.offsetWidth;host.classList.add('pg')};
addEventListener('hashchange',()=>{fr();pg()});document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.chip,.ct,a,.btn'))fr()},{passive:true});
})();</script>
